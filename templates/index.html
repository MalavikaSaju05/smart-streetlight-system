<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Smart Street Light Monitoring
    </title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                #f4f6f8;

            color:
                #182230;

            min-height:
                100vh;

        }


        /* ==================================================
           HEADER
        ================================================== */

        header {

            background:
                #111827;

            color:
                white;

            padding:
                22px 40px;

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            gap:
                20px;

        }


        .header-title h1 {

            font-size:
                25px;

            margin-bottom:
                5px;

        }


        .header-title p {

            font-size:
                14px;

            color:
                #cbd5e1;

        }


        .connection {

            padding:
                9px 16px;

            border-radius:
                20px;

            font-size:
                13px;

            font-weight:
                bold;

            background:
                #475569;

            white-space:
                nowrap;

        }


        .connection.connected {

            background:
                #16a34a;

        }


        .connection.disconnected {

            background:
                #dc2626;

        }


        /* ==================================================
           MAIN
        ================================================== */

        main {

            width:
                min(1200px, 94%);

            margin:
                35px auto;

        }


        /* ==================================================
           STATUS CARDS
        ================================================== */

        .status-grid {

            display:
                grid;

            grid-template-columns:
                repeat(
                    3,
                    1fr
                );

            gap:
                22px;

            margin-bottom:
                25px;

        }


        .card {

            background:
                white;

            border-radius:
                16px;

            padding:
                25px;

            box-shadow:
                0 5px 20px
                rgba(
                    0,
                    0,
                    0,
                    0.08
                );

        }


        .card-title {

            font-size:
                14px;

            color:
                #64748b;

            margin-bottom:
                12px;

        }


        .card-value {

            font-size:
                28px;

            font-weight:
                bold;

        }


        .environment-card {

            border-top:
                4px solid
                #1e293b;

        }


        .motion-card {

            border-top:
                4px solid
                #16a34a;

        }


        .brightness-card {

            border-top:
                4px solid
                #f59e0b;

        }


        /* ==================================================
           FAULT CARD
        ================================================== */

        .fault-card {

            margin-bottom:
                25px;

            border-top:
                4px solid
                #ef4444;

        }


        #fault {

            font-size:
                22px;

            font-weight:
                bold;

        }


        .fault-normal {

            color:
                #15803d;

        }


        .fault-active {

            color:
                #dc2626;

        }


        /* ==================================================
           LIGHTING NETWORK
        ================================================== */

        .network-card {

            background:
                white;

            border-radius:
                16px;

            padding:
                28px;

            box-shadow:
                0 5px 20px
                rgba(
                    0,
                    0,
                    0,
                    0.08
                );

        }


        .network-header {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            margin-bottom:
                25px;

        }


        .network-header h2 {

            font-size:
                22px;

        }


        .live-badge {

            padding:
                7px 13px;

            background:
                #ecfdf5;

            color:
                #15803d;

            border-radius:
                15px;

            font-size:
                12px;

            font-weight:
                bold;

        }


        .lights-grid {

            display:
                grid;

            grid-template-columns:
                repeat(
                    3,
                    1fr
                );

            gap:
                22px;

        }


        .light-card {

            background:
                #f8fafc;

            border-radius:
                14px;

            padding:
                28px 20px;

            text-align:
                center;

        }


        .bulb {

            width:
                110px;

            height:
                110px;

            margin:
                0 auto 18px;

            border-radius:
                50%;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            font-size:
                46px;

            background:
                #e2e8f0;

            transition:
                0.3s;

        }


        .light-name {

            font-size:
                17px;

            font-weight:
                bold;

            margin-bottom:
                8px;

        }


        .light-status {

            font-size:
                14px;

            font-weight:
                bold;

            color:
                #64748b;

        }


        /* ==================================================
           LIGHT STATES
        ================================================== */

        .bulb.off {

            background:
                #e2e8f0;

            filter:
                grayscale(1);

            opacity:
                0.6;

        }


        .bulb.dim {

            background:
                #fef3c7;

            box-shadow:
                0 0 20px
                rgba(
                    250,
                    204,
                    21,
                    0.3
                );

        }


        .bulb.bright {

            background:
                #fde68a;

            box-shadow:
                0 0 45px
                rgba(
                    250,
                    204,
                    21,
                    0.8
                );

        }


        /* ==================================================
           FOOTER INFO
        ================================================== */

        .footer-info {

            margin-top:
                25px;

            display:
                flex;

            justify-content:
                space-between;

            color:
                #64748b;

            font-size:
                13px;

        }


        /* ==================================================
           RESPONSIVE
        ================================================== */

        @media (
            max-width: 800px
        ) {

            .status-grid {

                grid-template-columns:
                    1fr;

            }


            .lights-grid {

                grid-template-columns:
                    1fr;

            }


            header {

                flex-direction:
                    column;

                align-items:
                    flex-start;

            }


            .footer-info {

                flex-direction:
                    column;

                gap:
                    8px;

            }

        }

    </style>

</head>


<body>


<!-- ======================================================
     HEADER
======================================================= -->

<header>

    <div class="header-title">

        <h1>
            Smart Street Light Monitoring
        </h1>

        <p>
            IoT-Based Intelligent Lighting System
        </p>

    </div>


    <div
        id="connection-badge"
        class="connection disconnected"
    >
        ESP32 DISCONNECTED
    </div>

</header>



<!-- ======================================================
     MAIN
======================================================= -->

<main>


    <!-- ==================================================
         MAIN STATUS
    =================================================== -->

    <section class="status-grid">


        <!-- Environment -->

        <div class="card environment-card">

            <div class="card-title">
                Environment
            </div>

            <div
                id="environment"
                class="card-value"
            >
                WAITING
            </div>

        </div>



        <!-- Motion -->

        <div class="card motion-card">

            <div class="card-title">
                Motion
            </div>

            <div
                id="motion"
                class="card-value"
            >
                NONE
            </div>

        </div>



        <!-- Brightness -->

        <div class="card brightness-card">

            <div class="card-title">
                Brightness
            </div>

            <div
                id="brightness"
                class="card-value"
            >
                0%
            </div>

        </div>


    </section>



    <!-- ==================================================
         FAULT
    =================================================== -->

    <section class="card fault-card">

        <div class="card-title">
            Fault Alert
        </div>

        <div
            id="fault"
            class="fault-normal"
        >
            ✓ NO FAULT
        </div>

    </section>



    <!-- ==================================================
         LIGHTING NETWORK
    =================================================== -->

    <section class="network-card">


        <div class="network-header">

            <h2>
                Lighting Network
            </h2>

            <div class="live-badge">
                LIVE STATUS
            </div>

        </div>



        <div class="lights-grid">


            <!-- LIGHT 1 -->

            <div class="light-card">

                <div
                    id="light1-bulb"
                    class="bulb off"
                >
                    💡
                </div>

                <div class="light-name">
                    Light 1
                </div>

                <div
                    id="light1-status"
                    class="light-status"
                >
                    OFF
                </div>

            </div>



            <!-- LIGHT 2 -->

            <div class="light-card">

                <div
                    id="light2-bulb"
                    class="bulb off"
                >
                    💡
                </div>

                <div class="light-name">
                    Light 2
                </div>

                <div
                    id="light2-status"
                    class="light-status"
                >
                    OFF
                </div>

            </div>



            <!-- LIGHT 3 -->

            <div class="light-card">

                <div
                    id="light3-bulb"
                    class="bulb off"
                >
                    💡
                </div>

                <div class="light-name">
                    Light 3
                </div>

                <div
                    id="light3-status"
                    class="light-status"
                >
                    OFF
                </div>

            </div>


        </div>

    </section>



    <!-- ==================================================
         FOOTER
    =================================================== -->

    <div class="footer-info">

        <div>
            Last updated:
            <strong id="last-updated">
                Waiting...
            </strong>
        </div>

        <div>
            ESP32 + Flask + IoT
        </div>

    </div>


</main>



<!-- ======================================================
     JAVASCRIPT
======================================================= -->

<script>


// ========================================================
// UPDATE LIGHT
// ========================================================

function updateLight(
    bulbId,
    statusId,
    state
)
{

    const bulb =
        document.getElementById(
            bulbId
        );

    const status =
        document.getElementById(
            statusId
        );


    // Remove previous state

    bulb.classList.remove(
        "off",
        "dim",
        "bright"
    );


    // Add current state

    if (
        state === "bright"
    )
    {
        bulb.classList.add(
            "bright"
        );
    }

    else if (
        state === "dim"
    )
    {
        bulb.classList.add(
            "dim"
        );
    }

    else
    {
        bulb.classList.add(
            "off"
        );
    }


    status.textContent =
        state.toUpperCase();

}



// ========================================================
// UPDATE DASHBOARD
// ========================================================

async function updateDashboard()
{

    try
    {

        const response =
            await fetch(
                "/api/status",
                {
                    cache: "no-store"
                }
            );


        if (
            !response.ok
        )
        {
            throw new Error(
                "Server returned an error"
            );
        }


        const data =
            await response.json();


        // ==================================================
        // CONNECTION
        // ==================================================

        const connectionBadge =
            document.getElementById(
                "connection-badge"
            );


        if (
            data.esp32_connected
        )
        {

            connectionBadge.textContent =
                "ESP32 CONNECTED";

            connectionBadge.classList.remove(
                "disconnected"
            );

            connectionBadge.classList.add(
                "connected"
            );

        }

        else
        {

            connectionBadge.textContent =
                "ESP32 DISCONNECTED";

            connectionBadge.classList.remove(
                "connected"
            );

            connectionBadge.classList.add(
                "disconnected"
            );

        }



        // ==================================================
        // ENVIRONMENT
        // ==================================================

        document.getElementById(
            "environment"
        ).textContent =
            data.environment.toUpperCase();



        // ==================================================
        // MOTION
        // ==================================================

        document.getElementById(
            "motion"
        ).textContent =
            data.motion.toUpperCase();



        // ==================================================
        // BRIGHTNESS
        // ==================================================

        const brightnessPercent =
            Math.round(
                (
                    data.brightness /
                    255
                ) * 100
            );


        document.getElementById(
            "brightness"
        ).textContent =
            brightnessPercent + "%";



        // ==================================================
        // FAULT
        // ==================================================

        const faultElement =
            document.getElementById(
                "fault"
            );


        if (
            data.fault ===
            "none"
        )
        {

            faultElement.textContent =
                "✓ NO FAULT";

            faultElement.className =
                "fault-normal";

        }

        else
        {

            faultElement.textContent =
                "⚠ " +
                data.fault;

            faultElement.className =
                "fault-active";

        }



        // ==================================================
        // LIGHTS
        // ==================================================

        updateLight(
            "light1-bulb",
            "light1-status",
            data.light1
        );


        updateLight(
            "light2-bulb",
            "light2-status",
            data.light2
        );


        updateLight(
            "light3-bulb",
            "light3-status",
            data.light3
        );



        // ==================================================
        // LAST UPDATED
        // ==================================================

        document.getElementById(
            "last-updated"
        ).textContent =
            data.last_updated;


    }

    catch(error)
    {

        console.error(
            "Dashboard update failed:",
            error
        );

    }

}



// ========================================================
// FIRST UPDATE
// ========================================================

updateDashboard();



// ========================================================
// CONTINUOUS UPDATE
// ========================================================

// Ask Flask for latest ESP32 state
// every 1 second.

setInterval(
    updateDashboard,
    1000
);


</script>


</body>

</html>

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Smart Street Light Monitoring</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f4f6f8;

            color: #222;

            min-height: 100vh;

        }


        /* ------------------------------
           HEADER
        ------------------------------ */

        header {

            background: #111827;

            color: white;

            padding: 22px;

            text-align: center;

        }


        header h1 {

            font-size: 28px;

            margin-bottom: 8px;

        }


        header p {

            color: #cbd5e1;

            font-size: 14px;

        }


        /* ------------------------------
           CONNECTION
        ------------------------------ */

        .connection-container {

            display: flex;

            justify-content: center;

            margin-top: 20px;

        }


        #connection-badge {

            padding: 10px 20px;

            border-radius: 25px;

            font-weight: bold;

            font-size: 14px;

        }


        .connected {

            background: #dcfce7;

            color: #166534;

        }


        .disconnected {

            background: #fee2e2;

            color: #991b1b;

        }


        /* ------------------------------
           MAIN
        ------------------------------ */

        main {

            width: 90%;

            max-width: 1100px;

            margin: 30px auto;

        }


        /* ------------------------------
           SENSOR CARDS
        ------------------------------ */

        .sensor-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(220px, 1fr)
                );

            gap: 20px;

            margin-bottom: 30px;

        }


        .card {

            background: white;

            padding: 24px;

            border-radius: 15px;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.08);

            text-align: center;

        }


        .card h3 {

            color: #6b7280;

            font-size: 15px;

            margin-bottom: 12px;

        }


        .value {

            font-size: 25px;

            font-weight: bold;

            text-transform: uppercase;

        }


        /* ------------------------------
           LIGHTS
        ------------------------------ */

        .lights-title {

            text-align: center;

            margin-bottom: 20px;

            font-size: 24px;

        }


        .lights-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(220px, 1fr)
                );

            gap: 20px;

        }


        .light-card {

            background: white;

            border-radius: 15px;

            padding: 25px;

            text-align: center;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.08);

        }


        .bulb {

            width: 80px;

            height: 80px;

            border-radius: 50%;

            background: #d1d5db;

            margin: 0 auto 20px;

            transition: 0.3s;

            border: 5px solid #9ca3af;

        }


        .bulb.on {

            background: #fff7a8;

            border-color: #facc15;

            box-shadow:
                0 0 30px
                rgba(250, 204, 21, 0.7);

        }


        .bulb.dim {

            background: #fde68a;

            border-color: #f59e0b;

            box-shadow:
                0 0 12px
                rgba(245, 158, 11, 0.4);

        }


        .bulb.fault {

            background: #ef4444;

            border-color: #991b1b;

            box-shadow:
                0 0 20px
                rgba(239, 68, 68, 0.5);

        }


        .light-status {

            font-size: 18px;

            font-weight: bold;

            text-transform: uppercase;

        }


        /* ------------------------------
           FOOTER
        ------------------------------ */

        footer {

            text-align: center;

            padding: 25px;

            color: #6b7280;

            font-size: 13px;

        }


        /* ------------------------------
           MOBILE
        ------------------------------ */

        @media (max-width: 600px) {

            header h1 {

                font-size: 22px;

            }

            main {

                width: 94%;

            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header>

        <h1>
            IoT Smart Street Light Monitoring
        </h1>

        <p>
            ESP32 Based Smart Lighting System
        </p>

        <div class="connection-container">

            <div
                id="connection-badge"
                class="disconnected"
            >
                ESP32 DISCONNECTED
            </div>

        </div>

    </header>



    <!-- MAIN -->

    <main>


        <!-- SENSOR INFORMATION -->

        <div class="sensor-grid">


            <div class="card">

                <h3>
                    Environment
                </h3>

                <div
                    id="environment"
                    class="value"
                >
                    WAITING
                </div>

            </div>



            <div class="card">

                <h3>
                    Motion
                </h3>

                <div
                    id="motion"
                    class="value"
                >
                    NONE
                </div>

            </div>



            <div class="card">

                <h3>
                    Brightness
                </h3>

                <div
                    id="brightness"
                    class="value"
                >
                    0%
                </div>

            </div>



            <div class="card">

                <h3>
                    Fault
                </h3>

                <div
                    id="fault"
                    class="value"
                >
                    NONE
                </div>

            </div>

        </div>



        <!-- LIGHTS -->

        <h2 class="lights-title">
            Street Lights
        </h2>


        <div class="lights-grid">


            <!-- LIGHT 1 -->

            <div class="light-card">

                <div
                    id="light1-bulb"
                    class="bulb"
                ></div>

                <h3>
                    Light 1
                </h3>

                <p
                    id="light1-status"
                    class="light-status"
                >
                    OFF
                </p>

            </div>



            <!-- LIGHT 2 -->

            <div class="light-card">

                <div
                    id="light2-bulb"
                    class="bulb"
                ></div>

                <h3>
                    Light 2
                </h3>

                <p
                    id="light2-status"
                    class="light-status"
                >
                    OFF
                </p>

            </div>



            <!-- LIGHT 3 -->

            <div class="light-card">

                <div
                    id="light3-bulb"
                    class="bulb"
                ></div>

                <h3>
                    Light 3
                </h3>

                <p
                    id="light3-status"
                    class="light-status"
                >
                    OFF
                </p>

            </div>

        </div>


    </main>



    <footer>

        Last Updated:
        <span id="last-updated">
            Waiting...
        </span>

    </footer>



    <script>


        // -----------------------------------------
        // GET ELEMENTS
        // -----------------------------------------

        const connectionBadge =
            document.getElementById(
                "connection-badge"
            );

        const environment =
            document.getElementById(
                "environment"
            );

        const motion =
            document.getElementById(
                "motion"
            );

        const brightness =
            document.getElementById(
                "brightness"
            );

        const fault =
            document.getElementById(
                "fault"
            );

        const lastUpdated =
            document.getElementById(
                "last-updated"
            );


        // Light elements

        const light1Status =
            document.getElementById(
                "light1-status"
            );

        const light2Status =
            document.getElementById(
                "light2-status"
            );

        const light3Status =
            document.getElementById(
                "light3-status"
            );


        const light1Bulb =
            document.getElementById(
                "light1-bulb"
            );

        const light2Bulb =
            document.getElementById(
                "light2-bulb"
            );

        const light3Bulb =
            document.getElementById(
                "light3-bulb"
            );



        // -----------------------------------------
        // UPDATE BULB
        // -----------------------------------------

        function updateBulb(
            bulb,
            status
        ) {

            bulb.className = "bulb";


            if (status === "bright") {

                bulb.classList.add(
                    "on"
                );

            }

            else if (status === "dim") {

                bulb.classList.add(
                    "dim"
                );

            }

            else if (
                status === "fault" ||
                status === "failed" ||
                status === "off"
            ) {

                if (
                    status === "fault" ||
                    status === "failed"
                ) {

                    bulb.classList.add(
                        "fault"
                    );

                }

            }

        }



        // -----------------------------------------
        // UPDATE DASHBOARD
        // -----------------------------------------

        function updateDashboard(data) {


            // Connection

            if (
                data.esp32_connected === true
            ) {

                connectionBadge.textContent =
                    "ESP32 CONNECTED";

                connectionBadge.className =
                    "connected";

            }

            else {

                connectionBadge.textContent =
                    "ESP32 DISCONNECTED";

                connectionBadge.className =
                    "disconnected";

            }



            // Environment

            environment.textContent =
                data.environment || "waiting";



            // Motion

            motion.textContent =
                data.motion || "none";



            // Brightness

            let brightnessPercent =
                Math.round(
                    (
                        Number(
                            data.brightness || 0
                        ) / 255
                    ) * 100
                );


            brightness.textContent =
                brightnessPercent + "%";



            // Fault

            fault.textContent =
                data.fault || "none";



            // Lights

            light1Status.textContent =
                data.light1 || "off";

            light2Status.textContent =
                data.light2 || "off";

            light3Status.textContent =
                data.light3 || "off";


            // Bulbs

            updateBulb(
                light1Bulb,
                data.light1 || "off"
            );

            updateBulb(
                light2Bulb,
                data.light2 || "off"
            );

            updateBulb(
                light3Bulb,
                data.light3 || "off"
            );


            // Last updated

            lastUpdated.textContent =
                data.last_updated ||
                "Waiting...";

        }



        // -----------------------------------------
        // GET STATUS
        // -----------------------------------------

        async function getStatus() {

            try {

                const response =
                    await fetch(
                        "/api/status",
                        {
                            cache: "no-store"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Server error"
                    );

                }


                const data =
                    await response.json();


                console.log(
                    "[DASHBOARD]",
                    data
                );


                updateDashboard(data);

            }

            catch (error) {

                console.error(
                    "[DASHBOARD ERROR]",
                    error
                );


                connectionBadge.textContent =
                    "SERVER ERROR";

                connectionBadge.className =
                    "disconnected";

            }

        }



        // -----------------------------------------
        // START
        // -----------------------------------------

        getStatus();


        // Update every 2 seconds

        setInterval(
            getStatus,
            2000
        );


    </script>


</body>

</html>
